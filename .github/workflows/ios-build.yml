name: iOS Build

# Build and run the shared scheme's UI tests on every push.
# Simulator only; no code signing required.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile (iOS Simulator)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          cd ios
          xcodebuild test \
            -project ReCall.xcodeproj \
            -scheme ReCall \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
